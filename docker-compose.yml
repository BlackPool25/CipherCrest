include:
  - path: lab/docker-compose.yml
    profiles: ["lab"]

services:
  postgres:
    container_name: ciphercrest-postgres
    image: postgres:16-alpine@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571 # pinned 2026-08-13T19:16:04Z postgres:16-alpine amd64 (manifest digest), fallback postgres:16-alpine
    environment:
      POSTGRES_DB: ciphcrest
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_dev_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ciphcrest -h 127.0.0.1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - lab
      - default

  demo:
    container_name: ciphercrest-demo
    build: .
    image: ${CIPHERCREST_IMAGE:-blackpool25/ciphercrest:demo}
    ports:
      - "8000:8000"
    environment:
      - PYTHONHASHSEED=0
      - OMP_NUM_THREADS=6
      - USE_STUB=false
      - PORT=8000
      - POSTGRES_DSN=postgresql://app:${POSTGRES_PASSWORD:-app_dev_only}@postgres:5432/ciphcrest
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || curl -fsS http://localhost:8000/flows || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lab
      - default

volumes:
  pgdata:
