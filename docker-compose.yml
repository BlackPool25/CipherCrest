include:
  - path: lab/docker-compose.yml
    profiles: ["lab"]

services:
  demo:
    build: .
    image: ghcr.io/ntro/securemailscope:demo
    ports:
      - "8000:8000"
    environment:
      - PYTHONHASHSEED=0
      - OMP_NUM_THREADS=6
      - USE_STUB=false
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || curl -fsS http://localhost:8000/flows || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
